<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- Adaptive SVG favicon (flips to white on dark browser tabs); PNG fallback for older browsers -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="icon" type="image/png" href="/logo.png" />
        <meta name="theme-color" content="#1e214b" />
        <!-- viewport-fit=cover: lets env(safe-area-inset-*) resolve in edge-to-edge
             webviews (Android shell / iOS PWA); no effect in ordinary browsers. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <!-- Installable app (PWA): manifest + iOS home-screen metadata -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="PLAZA PRO" />
        <meta
            name="description"
            content="PLAZA PRO — real-estate CRM for clients, inventory, deals and payments."
        />
        <title>PLAZA PRO</title>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
