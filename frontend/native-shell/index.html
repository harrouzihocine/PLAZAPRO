<!doctype html>
<html lang="en">
  <!--
    Stub webDir for the Capacitor Android shell (REMOTE mode) — and, since
    server.errorPath points here, the branded error screen the WebView shows
    when a load fails with NOTHING cached yet (fresh install opened offline;
    once the service worker has installed once, offline boots never land here).

    Self-healing: probes every server origin (app → office → bare LAN IP) on
    load, when Android reports connectivity back, on a slow poll, and on tap —
    then navigates to the first door that answers. Local file, no CSP in the
    way — the inline script is fine.

    Future "bundled assets" mode (store submission): point webDir at "dist",
    remove server.url, and switch the API/Echo base URLs to absolute — see
    docs/android-app.md.
  -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PLAZA PRO</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #1e214b;
        color: #c9a227;
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      p {
        color: #9aa0c3;
        line-height: 1.6;
        margin: 0.4rem 0;
      }
      button {
        margin-top: 1.25rem;
        padding: 0.65rem 2rem;
        border: 1px solid #c9a227;
        border-radius: 9999px;
        background: transparent;
        color: #c9a227;
        font-size: 1rem;
        font-family: inherit;
      }
      button:active {
        background: rgba(201, 162, 39, 0.15);
      }
    </style>
  </head>
  <body>
    <div>
      <h1 style="font-weight: 600; letter-spacing: 0.05em">PLAZA PRO</h1>
      <p>No connection — reconnecting automatically&hellip;</p>
      <p>Pas de connexion — reconnexion automatique&hellip;</p>
      <p dir="rtl">لا يوجد اتصال — ستتم إعادة المحاولة تلقائيًا&hellip;</p>
      <button type="button" onclick="retry()">Retry / Réessayer / إعادة المحاولة</button>
    </div>
    <script>
      // Walk ALL the doors, never just app.* — on office Wi-Fi navigator.onLine
      // is true even with the internet dead, so a blind retry of app.* loops
      // this page forever while the LAN origins sit reachable (the "stuck on
      // the blue screen" bug). Probe each origin's /up and navigate to the
      // first that answers, by priority. Keep the list in sync with
      // PlazaWebViewClient.java and frontend/src/utils/serverFailover.js.
      var ORIGINS = [
        'https://app.plaza-pro.com',
        'https://office.plaza-pro.com',
        'https://192.168.1.200',
      ]
      var PROBE_TIMEOUT_MS = 4000

      // Opaque no-cors fetch: resolving at all proves TCP+TLS reached our
      // server, which is all a local page can (and needs to) learn.
      function probe(origin) {
        return new Promise(function (resolve) {
          var ctl = new AbortController()
          var timer = setTimeout(function () {
            ctl.abort()
          }, PROBE_TIMEOUT_MS)
          fetch(origin + '/up', { mode: 'no-cors', cache: 'no-store', signal: ctl.signal }).then(
            function () {
              clearTimeout(timer)
              resolve(true)
            },
            function () {
              clearTimeout(timer)
              resolve(false)
            }
          )
        })
      }

      var probing = false
      function retry() {
        if (probing) return
        probing = true
        Promise.all(ORIGINS.map(probe)).then(function (up) {
          for (var i = 0; i < ORIGINS.length; i++) {
            if (up[i]) {
              // Leave `probing` latched: the page is navigating away, and a
              // second replace() from the next tick would cancel this one.
              window.location.replace(ORIGINS[i] + '/')
              return
            }
          }
          probing = false
        })
      }

      // Knock immediately, the instant Android reports the link back, and on
      // a slow poll as a backstop (navigator.onLine lags in the WebView).
      window.addEventListener('online', retry)
      setInterval(retry, 8000)
      retry()
    </script>
  </body>
</html>
