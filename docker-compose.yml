# docker-compose.yml — PLAZA PRO local dev stack
# Start everything:  docker compose up -d
services:
  nginx:
    image: nginx:alpine
    ports: ["${APP_PORT:-8080}:80"]
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]
    networks: [plaza-net]

  app: # Laravel + PHP-FPM (the heart of the backend)
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes: ["./backend:/var/www/html"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [plaza-net]

  queue: # async worker — same image as app
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: php artisan queue:work --tries=3 --timeout=120
    volumes: ["./backend:/var/www/html"]
    depends_on:
      app: { condition: service_started }
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped
    networks: [plaza-net]

  node: # Vue dev server (Vite)
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["${VITE_PORT:-5173}:5173"]
    volumes: ["./frontend:/app"]
    networks: [plaza-net]

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plaza}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
    ports: ["${MYSQL_PORT:-3306}:3306"]
    volumes: ["db-data:/var/lib/mysql"]
    networks: [plaza-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    networks: [plaza-net]

  mailpit: # catches dev e-mails — UI at http://localhost:8025
    image: axllent/mailpit
    ports: ["${MAILPIT_PORT:-8025}:8025"]
    networks: [plaza-net]

volumes:
  db-data:

networks:
  plaza-net:
