# docker-compose.yml — PLAZA PRO local dev stack
# Start everything:  docker compose up -d
services:
  nginx:
    image: nginx:alpine
    environment: { TZ: Africa/Algiers }
    ports: ["${APP_PORT:-8080}:80"]
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]
    networks: [plaza-net]

  app: # Laravel + PHP-FPM (the heart of the backend)
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment: { TZ: Africa/Algiers }
    volumes: ["./backend:/var/www/html"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [plaza-net]

  queue: # async worker — same image as app
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # queue:listen (not queue:work) so the worker picks up backend code changes
    # per job — queue:work caches classes in memory and silently runs stale
    # listeners until restarted. Prod uses its own compose with recycled workers.
    command: php artisan queue:listen --tries=3 --timeout=120
    environment: { TZ: Africa/Algiers }
    user: "${UID:-1000}:${GID:-1000}" # write storage/ as the host UID, not root
    volumes: ["./backend:/var/www/html"]
    depends_on:
      app: { condition: service_started }
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped
    networks: [plaza-net]

  media-queue: # media optimization worker — long ffmpeg/vips encodes on their own connection
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # Dedicated `media` connection (config/queue.php: retry_after 4000 s) so a
    # 4K transcode is never re-grabbed mid-encode, and the default workers'
    # 120 s timeout never touches it. queue:listen for the same per-job code
    # reload as the main dev worker.
    command: php artisan queue:listen media --queue=media --tries=1 --timeout=3600
    environment: { TZ: Africa/Algiers }
    user: "${UID:-1000}:${GID:-1000}" # write storage/ as the host UID, not root
    volumes: ["./backend:/var/www/html"]
    depends_on:
      app: { condition: service_started }
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped
    networks: [plaza-net]

  scheduler: # runs the cron schedule (routes/console.php) — same image as app
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: php artisan schedule:work
    environment: { TZ: Africa/Algiers }
    user: "${UID:-1000}:${GID:-1000}" # write storage/ as the host UID, not root
    volumes: ["./backend:/var/www/html"]
    depends_on:
      app: { condition: service_started }
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped
    networks: [plaza-net]

  reverb: # websocket server for live notifications + chat (Phase 5) — same image as app
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    environment: { TZ: Africa/Algiers }
    user: "${UID:-1000}:${GID:-1000}" # write storage/ as the host UID, not root
    ports: ["${REVERB_PORT:-8081}:8081"]
    volumes: ["./backend:/var/www/html"]
    depends_on:
      app: { condition: service_started }
      redis: { condition: service_started }
    restart: unless-stopped
    networks: [plaza-net]

  node: # Vue dev server (Vite)
    image: node:20-alpine
    environment: { TZ: Africa/Algiers }
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["${VITE_PORT:-5173}:5173"]
    volumes: ["./frontend:/app"]
    networks: [plaza-net]

  mysql:
    image: mysql:8
    # Algeria is UTC+1 year-round (no DST), so the fixed offset is exact. This
    # aligns DB-side defaults (CURRENT_TIMESTAMP / NOW()) with the app clock.
    command: --default-time-zone=+01:00
    environment:
      TZ: Africa/Algiers
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plaza}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
    ports: ["${MYSQL_PORT:-3306}:3306"]
    volumes: ["db-data:/var/lib/mysql"]
    networks: [plaza-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    environment: { TZ: Africa/Algiers }
    networks: [plaza-net]

  mailpit: # catches dev e-mails — UI at http://localhost:8025
    image: axllent/mailpit
    ports: ["${MAILPIT_PORT:-8025}:8025"]
    networks: [plaza-net]

volumes:
  db-data:

networks:
  plaza-net:
