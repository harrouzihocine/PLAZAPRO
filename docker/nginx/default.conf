# docker/nginx/default.conf — reverse proxy to the Laravel app (php-fpm)
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 210M;         # media / PPTX uploads — keep >= PHP post_max_size (docker/php/uploads.ini) and the 200M UploadMediaRequest ceiling

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        resolver 127.0.0.11 valid=10s;   # Docker embedded DNS — re-resolve so app container recreation (new IP) doesn't wedge nginx at a stale upstream (502)
        set $upstream app:9000;          # "app" = php-fpm service on plaza-net; via a variable so fastcgi_pass re-resolves per request instead of caching at startup
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {   # block dotfiles
        deny all;
    }
}
