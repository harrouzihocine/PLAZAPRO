# docker/nginx/default.conf — reverse proxy to the Laravel app (php-fpm)
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;          # media / PPTX uploads (tune per Media policy)

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;         # "app" = php-fpm service on plaza-net
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {   # block dotfiles
        deny all;
    }
}
