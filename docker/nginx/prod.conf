# docker/nginx/prod.conf — production vhosts (used ONLY by docker-compose.prod.yml).
#
# One backend for everything (no CORS, cookies just work):
#   /                          → built SPA (frontend/dist, mounted at /var/www/spa)
#   /api /sanctum /broadcasting /up → Laravel via php-fpm (app:9000)
#   /app                       → Reverb websocket (wss through the tunnel)
#
# Three entry paths, one server (see runbook §LAN HTTPS and docs/android-app.md):
#   internet → Cloudflare edge (TLS) → cloudflared → here on :80 (plain HTTP on
#              the isolated docker network; nothing listens on the internet)
#   office LAN by hostname → here on :443 with SNI, Let's Encrypt cert
#              (app./office.plaza-pro.com, kept fresh by scripts/renew-lan-cert.sh)
#   office LAN by bare IP → here on :443 WITHOUT SNI (browsers never send SNI
#              for IP URLs) — the default server below answers with the
#              private-CA cert (SAN IP:192.168.1.200) that only the Android
#              app trusts. That is the APK's DNS-free fallback when the office
#              internet is down; issued by scripts/setup-lan-ip-cert.sh.
#
# Both server blocks share their entire interior via prod-common.inc — they
# differ only in server_name and certificate pair. Certs are static paths on
# purpose: the root master process loads the 0600 keys at startup, and a
# missing file fails `nginx -t`/reload loudly instead of killing handshakes
# at runtime (variable certs are read per handshake BY THE WORKER, which
# can't read root-owned keys — learned the hard way).

# Recover the real client IP. Behind cloudflared, $remote_addr is the tunnel
# container; Cloudflare puts the true client in CF-Connecting-IP. Trust only
# private ranges (the docker network / office LAN) to supply it — an internet
# client can never reach this listener directly, but belt-and-braces.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

# Brute-force shield on credential endpoints (defense-in-depth on top of
# Laravel's throttle:login). Keyed by real client IP thanks to real_ip above.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

# Which plain-HTTP requests get bumped to HTTPS: LAN browsers only. Exempt the
# tunnel (Cloudflare already terminated TLS — redirecting it would loop) and
# the container-local healthcheck. Key is "<$https>:<CF header>:<client ip>";
# only "no TLS + no CF-Connecting-IP + not loopback" matches.
map "$https:$http_cf_connecting_ip:$remote_addr" $lan_https_redirect {
    default          0;
    "~^::(?!127\.)"  1;
}

# Websocket upgrade helper.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Named hosts (SNI): the Let's Encrypt cert maintained by
# scripts/setup-lan-tls.sh / renew-lan-cert.sh. The tunnel's plain-HTTP
# requests land here too, via their Host header.
server {
    listen 80;                     # cloudflared (+ LAN, redirected in the include)
    listen 443 ssl;                # direct office-LAN access by hostname
    http2 on;
    server_name app.plaza-pro.com office.plaza-pro.com;

    ssl_certificate     /etc/letsencrypt/nginx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/nginx/privkey.pem;

    include /etc/nginx/conf.d/prod-common.inc;
}

# Everything else — above all bare-IP clients, which send no SNI and no
# matching Host: the private-CA pair (placeholder-seeded by
# setup-lan-tls.sh --bootstrap-only until setup-lan-ip-cert.sh issues the
# real one). Also catches the container-local healthcheck on :80.
server {
    listen 80  default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/nginx/ip-fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/nginx/ip-privkey.pem;

    include /etc/nginx/conf.d/prod-common.inc;
}
