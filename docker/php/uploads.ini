; docker/php/uploads.ini — file-upload limits for the media library
; (project / unit galleries: photos, plans, PPTX presentations, documents).
;
; Without this file PHP runs at its stock defaults (upload_max_filesize=2M,
; post_max_size=8M), so any real presentation/plan is rejected with a 413
; PostTooLargeException before it ever reaches Laravel validation.
;
; Keep these three ceilings in sync:
;   - upload_max_filesize  == UploadMediaRequest 'max' rule (200 MB)
;   - post_max_size         > upload_max_filesize (multipart boundary + fields)
;   - nginx client_max_body_size (docker/nginx/default.conf) >= post_max_size
upload_max_filesize = 200M
post_max_size = 210M

; Uploads stream to a temp file, but PPTX preview generation and image work
; benefit from headroom over the 128M default.
memory_limit = 256M

; A 200 MB body over a slow uplink can take a while to arrive; don't let the
; input phase time out at the 60s default.
max_input_time = 300

; The gallery uploads one file per request, but allow a comfortable margin.
max_file_uploads = 30
