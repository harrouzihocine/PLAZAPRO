; docker/php/www.prod.conf — php-fpm pool sizing for production.
; Mounted ONLY by docker-compose.prod.yml as zz-www.prod.conf so it loads after
; (and overrides) the stock www.conf. Sized for ~30 concurrent office users on
; a 12-core / 30 GB host: 20 workers × ~70–120 MB ≈ 2.5 GB worst case — roughly
; 10× the expected load, far below the image default of pm.max_children = 5.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10

; Recycle each worker after 500 requests — caps slow memory creep from
; long-lived PHP processes (dompdf, image work).
pm.max_requests = 500

; Surface slow requests in `docker logs` before users report them.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
catch_workers_output = yes
decorate_workers_output = no
