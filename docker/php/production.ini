; docker/php/production.ini — production PHP overrides.
; Mounted ONLY by docker-compose.prod.yml (as zz-production.ini so it loads
; after uploads.ini); the dev stack never sees this file.

; Never advertise the PHP version or print errors to users.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; OPcache sized for the app + vendor tree. Timestamps revalidate every 60s so
; a deploy (git pull on the bind mount) is picked up without an fpm restart,
; while steady-state requests never stat() files.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; The vendor tree is large; keep resolved paths cached.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Sessions ride Laravel (database driver), never PHP's native session files.
session.use_strict_mode = 1
