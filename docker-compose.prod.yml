# docker-compose.prod.yml — PLAZA PRO production stack.
#
# Standalone file (NOT an override of docker-compose.yml). Run it from a
# dedicated production checkout whose .env sets COMPOSE_FILE=docker-compose.prod.yml
# (scripts/generate-prod-env.sh writes that), so every `docker compose` command
# there picks this file automatically. See docs/production-runbook.md.
#
# Differences from dev, on purpose:
#   - no Vite dev server, no Mailpit
#   - NOTHING published to the network except nginx (and the outbound-only tunnel);
#     MySQL/Redis/Reverb are unreachable from outside docker
#   - mysql + redis live on an internal-only network (no internet egress — even a
#     compromised DB container cannot phone data home)
#   - php-fpm pool + opcache tuned (docker/php/www.prod.conf, production.ini)
#   - queue on Redis, 2 workers, hourly self-recycle
#   - every service: restart policy, log rotation, no-new-privileges

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-php-base: &php-base
  build:
    context: ./docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  environment:
    TZ: Africa/Algiers
  volumes:
    - ./backend:/var/www/html
    - ./docker/php/production.ini:/usr/local/etc/php/conf.d/zz-production.ini:ro
    - ./docker/php/www.prod.conf:/usr/local/etc/php-fpm.d/zz-www.prod.conf:ro
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  logging: *logging
  networks: [internal, edge]

services:
  nginx:
    image: nginx:1.27-alpine
    environment: { TZ: Africa/Algiers }
    # The ONLY published ports. Office LAN uses 443 (trusted Let's Encrypt cert,
    # split-horizon DNS — runbook §LAN HTTPS); 80 serves the healthcheck and
    # redirects stray LAN HTTP; internet traffic arrives through the tunnel.
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_TLS_PORT:-443}:443"
    volumes:
      - ./backend:/var/www/html:ro
      - ./frontend/dist:/var/www/spa:ro
      # Android APK download (gitignored dir, survives SPA rebuilds — dist/ is
      # wiped on every deploy). Publish: scripts/build-android.sh prints the cp.
      # Create the dir BEFORE `up` or docker makes it root-owned (no sudo here).
      - ./downloads:/var/www/downloads:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared interior of both server blocks (named-host + bare-IP fallback);
      # .inc so conf.d's *.conf glob doesn't load it twice.
      - ./docker/nginx/prod-common.inc:/etc/nginx/conf.d/prod-common.inc:ro
      # Certs live in the named volume (certbot writes, nginx only reads).
      # setup-lan-tls.sh MUST run before first start — nginx refuses to boot
      # without /etc/letsencrypt/nginx/*.pem (deploy.sh bootstraps this).
      - letsencrypt:/etc/letsencrypt:ro
    depends_on: [app]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [internal, tunnel]   # backends one side, cloudflared the other; no egress needed
    healthcheck:
      # Exercises the full chain: nginx → php-fpm → Laravel /up.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Outbound-only HTTPS tunnel — the public entry point. Quarantined on the
  # `tunnel` network where the ONLY other container is nginx: even a hijacked
  # Cloudflare account rewiring the tunnel's service target can reach nothing
  # but nginx:80 — not php-fpm (raw FastCGI = code execution), not Reverb,
  # and never mysql/redis.
  cloudflared:
    image: cloudflare/cloudflared:2024.10.0
    command: tunnel --no-autoupdate run
    environment:
      # Required when the "tunnel" profile is active (see docs/production-runbook.md).
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [nginx]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [tunnel]         # egress to Cloudflare + nginx; nothing else
    profiles: ["tunnel"]       # enable with: docker compose --profile tunnel up -d

  # Split-horizon DNS for the office LAN (the Nokia GPON gateway has no local
  # DNS records feature): answers the app hostname with the server's LAN IP,
  # forwards everything else upstream. Point the router's DHCP DNS at
  # LAN_DNS_IP (runbook §1.5). Binds 53 on the LAN IP only — never 0.0.0.0 —
  # so it can't collide with systemd-resolved's 127.0.0.53 stub.
  dnsmasq:
    build: ./docker/dnsmasq
    command:
      - --keep-in-foreground
      - --log-facility=-            # stdout → docker logs
      - --no-resolv                 # never read the container's resolv.conf
      - --no-hosts
      - --cache-size=1000
      # --address answers default to TTL 0, so clients re-query on every
      # lookup; 300s lets office PCs keep resolving through the brief dnsmasq
      # recreate during a deploy.
      - --local-ttl=300
      # Disables the implicit local-service filter, which drops LAN queries
      # because they arrive via docker NAT from a "non-local" subnet. Exposure
      # is already limited by publishing on the LAN IP only.
      - --except-interface=lo
      - --address=/${LAN_TLS_DOMAIN:-app.plaza-pro.com}/${LAN_DNS_IP:-}
      - --server=8.8.8.8
      - --server=8.8.4.4
    environment: { TZ: Africa/Algiers }
    ports:
      - "${LAN_DNS_IP:-127.0.0.1}:53:53/udp"
      - "${LAN_DNS_IP:-127.0.0.1}:53:53/tcp"
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [edge]                # needs egress to the upstream resolvers
    profiles: ["lan-dns"]           # enable with: docker compose --profile lan-dns up -d
    healthcheck:
      # Query the container's own interface (dnsmasq skips lo via --except-interface),
      # proving the --address rule answers. 127.0.0.1 would fail — nothing listens there.
      test: ["CMD-SHELL", "nslookup ${LAN_TLS_DOMAIN:-app.plaza-pro.com} $(hostname -i) >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # OPTIONAL DHCP takeover (profile lan-dhcp) — for routers whose firmware
  # hides the DHCP-DNS setting (stock Nokia GPON). The router keeps routing;
  # this hands out the leases instead, with DNS pointed at this server, so
  # every office device gets split-horizon DNS with zero per-device setup.
  #
  # BEFORE enabling (order matters — two DHCP servers on one LAN fight):
  #   1. disable the DHCP server in the router's own settings
  #   2. docker compose stop dnsmasq        (they'd race for LAN-IP:53)
  #   3. docker compose --profile lan-dhcp up -d --build dnsmasq-dhcp
  dnsmasq-dhcp:
    build: ./docker/dnsmasq
    network_mode: host              # DHCP needs raw LAN broadcasts (no NAT)
    cap_add: [NET_ADMIN, NET_RAW]
    command:
      - --keep-in-foreground
      - --log-facility=-
      - --no-resolv
      - --no-hosts
      - --cache-size=1000
      - --local-ttl=300
      - --bind-interfaces           # with listen-address: leaves systemd-resolved's
      - --listen-address=${LAN_DNS_IP:-}   # 127.0.0.53 stub untouched
      - --address=/${LAN_TLS_DOMAIN:-app.plaza-pro.com}/${LAN_DNS_IP:-}
      - --server=8.8.8.8
      - --server=8.8.4.4
      - --dhcp-range=${LAN_DHCP_RANGE:-192.168.1.50,192.168.1.199,12h}
      - --dhcp-option=option:router,${LAN_GATEWAY:-192.168.1.254}
      - --dhcp-option=option:dns-server,${LAN_DNS_IP:-}
      - --dhcp-authoritative        # sole DHCP on this LAN (router's is OFF)
    environment: { TZ: Africa/Algiers }
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    profiles: ["lan-dhcp"]
    healthcheck:
      test: ["CMD", "nslookup", "${LAN_TLS_DOMAIN:-app.plaza-pro.com}", "${LAN_DNS_IP:-127.0.0.1}"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Let's Encrypt via Cloudflare DNS-01 for the office-LAN listener. Never part
  # of `up` (profile) — invoked as one-shots by scripts/setup-lan-tls.sh and
  # the renew cron (scripts/renew-lan-cert.sh). DNS-01 needs no inbound port,
  # so the tunnel-only posture is preserved; egress (ACME + Cloudflare API)
  # rides the same network php uses for mail/composer.
  certbot:
    image: certbot/dns-cloudflare:v4.1.1
    environment: { TZ: Africa/Algiers }
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./secrets/cloudflare-dns.ini:/run/secrets/cloudflare-dns.ini:ro
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [edge]
    profiles: ["lan-tls"]

  app: # Laravel + PHP-FPM
    <<: *php-base
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "pgrep", "php-fpm"]
      interval: 30s
      timeout: 5s
      retries: 3

  queue: # async workers ×2 — --max-time recycles each worker hourly (memory hygiene)
    <<: *php-base
    command: php artisan queue:work --tries=3 --timeout=120 --max-time=3600 --sleep=1
    user: "${UID:-1000}:${GID:-1000}"
    deploy:
      replicas: 2
    depends_on:
      app: { condition: service_started }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  media-queue: # media optimization worker — long ffmpeg/vips encodes (OptimizeMedia)
    <<: *php-base
    # Dedicated `media` connection (config/queue.php: retry_after 4000 s) so a
    # 4K transcode is never re-grabbed mid-encode. --tries=1: a failed encode
    # marks the row failed and keeps serving the original — no point re-burning
    # minutes of CPU. --max-time recycles the worker every 4 h (memory hygiene,
    # only between jobs — never mid-encode).
    command: php artisan queue:work media --queue=media --tries=1 --timeout=3600 --max-time=14400 --sleep=3
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      app: { condition: service_started }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler: # cron schedule (routes/console.php)
    <<: *php-base
    command: php artisan schedule:work
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      app: { condition: service_started }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  reverb: # websocket server — reached only via nginx's /app proxy, never published
    <<: *php-base
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      app: { condition: service_started }
      redis: { condition: service_healthy }

  mysql:
    # Pinned to the 8.0 series to match the existing db-data volume — do NOT
    # jump to 8.4 without a planned in-place upgrade + tested restore.
    image: mysql:8.0
    # No ports: — unreachable from the host network entirely.
    command:
      # Algeria is UTC+1 year-round (no DST) — align DB-side defaults
      # (CURRENT_TIMESTAMP / NOW()) with the app clock.
      - --default-time-zone=+01:00
      - --innodb-buffer-pool-size=2G
      - --slow-query-log=ON
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=1
    environment:
      TZ: Africa/Algiers
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plaza}
      MYSQL_USER: ${MYSQL_USER:-plaza}                # least-privilege app user (single schema)
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes: ["db-data:/var/lib/mysql"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    # AOF (everysec): queued jobs survive a container restart, not just snapshots.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes: ["redis-data:/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  redis-data:
  letsencrypt:

networks:
  tunnel: # cloudflared ↔ nginx ONLY (+ egress to Cloudflare) — the tunnel's blast radius
  edge: # php services' internet egress (mail, composer on deploy)
  internal: # app ↔ mysql/redis/reverb; no route to the outside world
    internal: true
